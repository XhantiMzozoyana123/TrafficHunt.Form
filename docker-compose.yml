services:
  web:
    build:
      context: .
      dockerfile: TrafficHunt.Web/Dockerfile
    container_name: traffichunt-web
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS:-http://0.0.0.0:8080}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Data Source=App_Data/traffichunt.db}
      - YouTube__ApiKey=${YOUTUBE_API_KEY:-AIzaSyD38e262JU3hLOp3Uhw7YWwsbN6sQrn48c}
      - LLM__Url=${LLM_URL:-http://46.202.170.203:11434/api/generate}
      - LLM__Model=${LLM_MODEL:-llama3:latest}
    ports:
      - "5000:8080"
    volumes:
      - traffichunt-web-data:/app/App_Data
    networks:
      - traffichunt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.4
    container_name: traffichunt-mysql
    restart: unless-stopped
    env_file:
      - ./docker/.env
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-traffichuntdb}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-ChangeMeStrong!}
      - MYSQL_USER=${MYSQL_USER:-traffichunt}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ChangeMeStrong!}
    ports:
      - "3306:3306"
    volumes:
      - traffichunt-mysql-data:/var/lib/mysql
    networks:
      - traffichunt
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: traffichunt-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - traffichunt-ollama-data:/root/.ollama
    networks:
      - traffichunt

  nginx:
    image: nginx:alpine
    container_name: traffichunt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - traffichunt

volumes:
  traffichunt-mysql-data:
  traffichunt-ollama-data:
  traffichunt-web-data:

networks:
  traffichunt:
    driver: bridge
